<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单图题库编辑器</title><link rel="icon" type="image/png" sizes="32x32" href="../assets/game-icon.png"><link rel="icon" type="image/svg+xml" sizes="any" href="../assets/game-icon.svg"><link rel="stylesheet" href="../style.css"><script type="module" src="./editor.js"></script>
<style>body{max-width:1050px;margin:0 auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px}header a{color:var(--red);font-size:13px}h1{font-family:inherit;font-size:25px;letter-spacing:0;margin:0}h2{font-size:15px;font-weight:500;margin:0}p{font-size:13px;color:var(--muted);line-height:1.9}.help{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin:24px 0}.help code{font-size:12px;color:var(--red)}.toolbar,.pagination{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.tool-button{background:white;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12px}.tool-button:disabled{opacity:.4}.toolbar .primary-button{margin-left:auto;min-width:0;padding:10px 16px;font-size:12px}#status{font-size:12px;line-height:1.8;white-space:pre-line;color:var(--red)}.editor-question{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin:15px 0}.question-top{display:flex;gap:15px;align-items:end;margin-bottom:15px}.question-top .text-field{max-width:180px}.question-top .remove{margin-left:auto;color:#9b514b;background:none;border:0;font-size:12px;padding-bottom:10px}.enabled{display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:12px;padding-bottom:10px}.fields{display:grid;grid-template-columns:160px 1fr;gap:20px;align-items:center}.text-field{display:flex;flex-direction:column;gap:7px;font-size:11px;color:var(--muted)}input[type=text],input[type=search],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:var(--paper);color:var(--ink)}.image-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.image-fields .text-field:first-child{grid-column:1/-1}.preview{width:160px;height:140px;object-fit:contain;background:var(--paper);border-radius:7px}.source-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}#empty{text-align:center;padding:45px 20px;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:12px}.privacy{font-size:11px;margin-top:25px}#search{max-width:270px}.pagination{justify-content:flex-end}#page-label{font-size:12px;margin-right:auto;color:var(--muted)}@media(max-width:640px){body{padding:24px 16px}.fields{grid-template-columns:1fr}.preview{width:100%;height:180px}.source-fields,.image-fields{grid-template-columns:1fr}.question-top{gap:9px}.editor-question{padding:14px}.toolbar .primary-button{margin-left:0}h1{font-size:22px}#search{max-width:none}}</style></head>
<body>
<header><h1>单图题库编辑器</h1><a href="../">返回游戏 ↗</a></header>
<div class="help"><h2>一张图片，一道判断题</h2><p>可直接加载当前题库，编辑真假标签、生成模型和来源。模型没有公开时留空。</p><p>也可以在 <code>assets/questions/</code> 下每题建一个文件夹，例如 <code>q001</code>，放入一张 <code>real.jpg</code> 或 <code>ai.jpg</code>，可选添加 <code>model.txt</code>。支持 jpg、jpeg、png、webp、avif。导入整个 <code>questions</code> 文件夹，再导出配置。</p></div>
<div class="toolbar"><button id="load-current" class="tool-button" type="button">加载当前题库</button><button id="folder-button" class="tool-button" type="button">导入图片文件夹</button><input id="folder-input" type="file" webkitdirectory multiple hidden><button id="json-button" class="tool-button" type="button">导入已有配置</button><input id="json-input" type="file" accept=".json,application/json" hidden><button id="add" class="tool-button" type="button">＋ 添加题目</button><button id="export" class="primary-button" type="button" disabled>导出题库配置 ↓</button></div>
<div id="status" role="status" aria-live="polite"></div>
<div class="pagination"><span id="page-label"></span><input id="search" type="search" aria-label="搜索题号、来源或模型" placeholder="搜索题号、来源或模型"><button id="previous" class="tool-button" type="button">上一页</button><button id="following" class="tool-button" type="button">下一页</button></div>
<div id="empty">加载当前题库，或导入配置开始编辑。</div><div id="questions"></div>
<p class="privacy">编辑器仅在当前浏览器内读取文件。导出后需自行替换 data/questions.json；图片需要放在相应本地路径。</p>
</body></html>
