name: 部署小游戏到 GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 下载题库图片
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download question-bank-20261017 --repo "${{ github.repository }}" --pattern question-images.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/question-images.zip" -d "$GITHUB_WORKSPACE"
      - name: 检查题库和游戏逻辑
        run: |
          npm run check
          npm test
      - name: 生成静态网站
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
