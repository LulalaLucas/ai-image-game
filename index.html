<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8c1c2d">
  <meta name="description" content="是真实照片，还是 AI 生成？每轮六张图片，看看你能答对几张。">
  <title>真实，还是 AI？</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/game-icon.png"><link rel="icon" type="image/svg+xml" sizes="any" href="./assets/game-icon.svg">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img class="brand-logo" src="./assets/event-logo.png" alt="北京大学校徽" width="52" height="52">
      <div><div class="brand-school">北京大学计算机学院</div><div class="brand-event"><span>1024</span> 文化节</div></div>
    </div>
    <button class="reset-button" id="reset" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1.4 7M4 4v6h6"/></svg><span>重新开始</span></button>
  </header>
  <main>
    <section class="introduction" aria-labelledby="title">
      <div class="eyebrow"><span class="tiny-dot"></span>AI 图片辨别挑战</div>
      <h1 id="title">真实，还是 <span>AI</span>？</h1>
      <p class="instructions">仔细看看这张图片。<br class="mobile-break">它是真实拍摄，还是由 AI 生成？</p>
    </section>
    <section id="game" class="game" aria-label="图片辨识游戏" aria-busy="true">
      <div class="round-bar">
        <div class="question-number"><strong id="question-number">01</strong><span id="question-total">/ 06</span></div>
        <div id="progress" class="progress" aria-label="答题进度"></div>
        <div class="score">答对 <strong id="score">0</strong> 题</div>
      </div>
      <article id="image-card" class="image-card">
        <button id="picture" class="picture-button" type="button" aria-label="放大查看当前图片">
          <img id="question-image" class="loading" alt="待判断的图片" decoding="async" draggable="false">
          <span id="image-loading" class="image-loading">图片加载中…</span>
          <span class="expand-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg></span>
        </button>
      </article>
      <div id="judgment" class="judgment" role="group" aria-label="判断是真实照片还是 AI 生成">
        <button id="answer-real" class="judgment-button real-button" type="button" disabled><span>真实照片</span><small>REAL · R / ←</small></button>
        <button id="answer-ai" class="judgment-button ai-button" type="button" disabled><span>AI 生成</span><small>AI · A / →</small></button>
      </div>
      <div id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <div class="action-bar">
        <p class="view-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5M7 10h6m-3-3v6"/></svg>点击图片放大查看</p>
        <button id="next" class="primary-button" type="button" disabled>下一题 <span aria-hidden="true">→</span></button>
      </div>
    </section>
    <section id="result" class="result" aria-labelledby="result-title" hidden></section>
    <div id="notice" class="notice" role="status" hidden></div>
    <div id="error" class="error-box" role="alert" hidden></div>
    <p id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  </main>
  <footer>看不准时，可以放大图片看看细节。</footer>
  <dialog id="lightbox" class="lightbox" aria-labelledby="lightbox-title">
    <div class="lightbox-toolbar"><span id="lightbox-title">查看图片</span><div class="zoom-controls"><button id="zoom-out" type="button" aria-label="缩小">−</button><button id="zoom-reset" type="button" aria-label="恢复适合屏幕大小">100%</button><button id="zoom-in" type="button" aria-label="放大">＋</button><button id="close-lightbox" class="close-button" type="button" aria-label="关闭放大图片">×</button></div></div>
    <div id="lightbox-stage" class="lightbox-stage"><div id="lightbox-canvas"><img id="large-image" alt="放大图片"></div></div>
    <div class="lightbox-bottom">使用 ＋ / − 查看细节 · 按 Esc 关闭</div>
  </dialog>
</body>
</html>
