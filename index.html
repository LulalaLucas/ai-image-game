<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8c1c2d">
  <meta name="description" content="是真实照片，还是 AI 生成？每轮六题，每题两张图片，限时十秒找出 AI 生成的那张。">
  <title>真实，还是 AI？</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/game-icon.png"><link rel="icon" type="image/svg+xml" sizes="any" href="./assets/game-icon.svg">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="brand-emblems"><img class="school-logo" src="./assets/pku-dual-emblems.jpg" alt="北京大学校徽与计算机学院院徽" width="640" height="640"></div>
      <div class="brand-copy"><div class="brand-school">北京大学计算机学院</div><div class="brand-event"><span>1024</span> 计算机文化艺术节</div></div>
    </div>
    <button class="reset-button" id="reset" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1.4 7M4 4v6h6"/></svg><span>重新开始</span></button>
  </header>
  <main>
    <section class="introduction" aria-labelledby="title">
      <div class="eyebrow"><span class="tiny-dot"></span>AI 图片辨别挑战</div>
      <h1 id="title">真实，还是 <span>AI</span>？</h1>
      <p class="instructions">两张图片，一真一假 · 请在 10 秒内<strong class="instruction-highlight">选出 AI 生成的那张</strong></p>
    </section>
    <section id="game" class="game" aria-label="图片辨识游戏" aria-busy="true">
      <div class="round-bar">
        <div class="question-number"><strong id="question-number">01</strong><span id="question-total">/ 06</span></div>
        <div id="progress" class="progress" aria-label="答题进度"></div>
        <div class="score">答对 <strong id="score">0</strong> 题</div>
      </div>
      <div class="timer-panel" id="timer-panel">
        <div class="timer-label"><span id="timer-status">图片加载后开始计时</span><span class="timer-value"><strong id="timer">10</strong><small>秒</small></span></div>
        <div class="timer-track" aria-hidden="true"><div id="timer-fill" class="timer-fill"></div></div>
      </div>
      <div id="choices" class="choices" role="group" aria-label="选择 AI 生成的图片">
        <article id="option-card-0" class="option-card">
          <div class="picture-wrap">
          <button id="picture-0" class="picture-button" type="button" aria-label="选择图片 A 为 AI 生成" disabled>
            <img id="question-image-0" class="loading" alt="待判断的图片 A" decoding="async" draggable="false">
            <span id="image-loading-0" class="image-loading">图片加载中…</span>
          </button>
          <button id="expand-0" class="expand-button" type="button" aria-label="放大查看图片 A" title="放大查看（不作答）" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M7.5 10.5h6m-3-3v6"/></svg></button>
          </div>
          <button id="answer-0" class="choice-button" type="button" disabled><span class="choice-letter">A</span><span>选这张</span><small>← / 1</small></button>
        </article>
        <article id="option-card-1" class="option-card">
          <div class="picture-wrap">
          <button id="picture-1" class="picture-button" type="button" aria-label="选择图片 B 为 AI 生成" disabled>
            <img id="question-image-1" class="loading" alt="待判断的图片 B" decoding="async" draggable="false">
            <span id="image-loading-1" class="image-loading">图片加载中…</span>
          </button>
          <button id="expand-1" class="expand-button" type="button" aria-label="放大查看图片 B" title="放大查看（不作答）" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M7.5 10.5h6m-3-3v6"/></svg></button>
          </div>
          <button id="answer-1" class="choice-button" type="button" disabled><span class="choice-letter">B</span><span>选这张</span><small>→ / 2</small></button>
        </article>
      </div>
      <div id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <div class="action-bar">
        <p class="view-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5M7 10h6m-3-3v6"/></svg>点击图片作答 · 右上角放大镜查看细节</p>
        <p id="advance-notice" class="advance-notice" role="status" hidden></p>
      </div>
    </section>
    <section id="result" class="result" aria-labelledby="result-title" hidden></section>
    <div id="notice" class="notice" role="status" hidden></div>
    <div id="error" class="error-box" role="alert" hidden></div>
    <p id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  </main>
  <footer>每题仅有一张 AI 图片 · 答对得 1 分，超时不得分</footer>
  <dialog id="lightbox" class="lightbox" aria-labelledby="lightbox-title">
    <div class="lightbox-toolbar"><span id="lightbox-title">查看图片</span><div class="zoom-controls"><button id="zoom-out" type="button" aria-label="缩小">−</button><button id="zoom-reset" type="button" aria-label="恢复适合屏幕大小">100%</button><button id="zoom-in" type="button" aria-label="放大">＋</button><button id="close-lightbox" class="close-button" type="button" aria-label="关闭放大图片">×</button></div></div>
    <div id="lightbox-stage" class="lightbox-stage"><div id="lightbox-canvas"><img id="large-image" alt="放大图片"></div></div>
    <div class="lightbox-bottom">放大查看时仍会计时 · 按 Esc 返回答题</div>
  </dialog>
</body>
</html>
